[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "themathsolver"
version = "0.1.0"
description = "Solve math exercises from PDFs/images using Gemini, output LaTeX + PDF"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
solve = "solver:main"

[tool.setuptools]
py-modules = ["solver"]
